[package]
name = "sierra_launcher"
version = "0.1.0"
edition = "2024"

[profile.dev]
opt-level = 1
debug = 1
incremental = true

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
layer-shika = "0.3.1"
slint = "1.17.0"
notify = "8.1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
layer-shika-adapters = "0.3.1"
chrono = "0.4.45"
image = "0.25"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[patch.crates-io]
layer-shika = { path = "/home/waterisblue/dev/layer-shika" }
layer-shika-adapters = { path = "/home/waterisblue/dev/layer-shika/crates/adapters" }
layer-shika-composition = { path = "/home/waterisblue/dev/layer-shika/crates/composition" }
layer-shika-domain = { path = "/home/waterisblue/dev/layer-shika/crates/domain" }

[build-dependencies]
slint-build = "1.17.0"
